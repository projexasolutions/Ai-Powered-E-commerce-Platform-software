spring:
  application:
    name: nextgen-store-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nextgen_store}
    username: ${DATABASE_USERNAME:nextgen}
    password: ${DATABASE_PASSWORD:nextgen}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-please}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
