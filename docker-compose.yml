services:
  postgres:
    image: postgres:17
    container_name: nextgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextgen_store
      POSTGRES_USER: nextgen
      POSTGRES_PASSWORD: nextgen
    ports:
      - "5432:5432"
    volumes:
      - nextgen_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: nextgen-store-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/nextgen_store
      DATABASE_USERNAME: nextgen
      DATABASE_PASSWORD: nextgen
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      JWT_SECRET: change-this-development-secret-to-a-long-random-value-please
    ports:
      - "8080:8080"

volumes:
  nextgen_pgdata:
